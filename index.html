<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANFE</title>
</head>
<body>

    <h1>Teste DANFE</h1>

    <p>Número da NF:</p>
    <strong id="numero"></strong>

    <p>Valor:</p>
    <strong id="valor"></strong>

    <script>
        function base64UrlDecode(valor) {
            valor = valor.replace(/-/g, "+").replace(/_/g, "/");

            while (valor.length % 4) {
                valor += "=";
            }

            return decodeURIComponent(
                Array.prototype.map.call(
                    atob(valor),
                    c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)
                ).join("")
            );
        }

        try {
            const payload = window.location.hash.substring(1);

            const json = base64UrlDecode(payload);

            const dados = JSON.parse(json);

            document.getElementById("numero").textContent = dados.numero;
            document.getElementById("valor").textContent = "R$ " + dados.valor;
        }
        catch (erro) {
            document.body.innerHTML += "<p>Erro ao ler os dados.</p>";
        }
    </script>

</body>
</html>
