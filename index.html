<script>


// ================================================================
// BASE64 URL-SAFE -> BYTES
// ================================================================

function base64UrlParaBytes(valor) {

    valor = valor
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    while (valor.length % 4) {
        valor += "=";
    }

    const binario =
        atob(valor);

    const bytes =
        new Uint8Array(
            binario.length
        );

    for (
        let i = 0;
        i < binario.length;
        i++
    ) {

        bytes[i] =
            binario.charCodeAt(i);

    }

    return bytes;
}


// ================================================================
// DESCOMPACTA GZIP
// ================================================================

async function descompactarPayload(payload) {

    const bytes =
        base64UrlParaBytes(payload);

    if (
        typeof DecompressionStream ===
        "undefined"
    ) {

        throw new Error(
            "Este navegador não suporta descompactação GZip."
        );

    }

    const stream =
        new Blob([bytes])
            .stream()
            .pipeThrough(
                new DecompressionStream(
                    "gzip"
                )
            );

    return await new Response(
        stream
    ).text();
}


// ================================================================
// PROTEÇÃO HTML
// ================================================================

function h(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {
        return "";
    }

    return String(valor)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ================================================================
// MOEDA
// ================================================================

function moeda(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {
        return "";
    }

    const numero =
        Number(
            String(valor)
                .replace(",", ".")
        );

    if (
        Number.isNaN(numero)
    ) {
        return h(valor);
    }

    return numero.toLocaleString(
        "pt-BR",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}


// ================================================================
// DATA
// ================================================================

function dataFormatada(valor) {

    if (!valor) {
        return "";
    }

    try {

        const data =
            new Date(valor);

        if (
            Number.isNaN(
                data.getTime()
            )
        ) {
            return h(valor);
        }

        return data.toLocaleString(
            "pt-BR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }
    catch {

        return h(valor);

    }

}


// ================================================================
// CPF / CNPJ
// ================================================================

function formatarDocumento(valor) {

    if (!valor) {
        return "";
    }

    const numero =
        String(valor)
            .replace(
                /\D/g,
                ""
            );

    if (
        numero.length === 11
    ) {

        return numero.replace(
            /(\d{3})(\d{3})(\d{3})(\d{2})/,
            "$1.$2.$3-$4"
        );

    }

    if (
        numero.length === 14
    ) {

        return numero.replace(
            /(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
            "$1.$2.$3/$4-$5"
        );

    }

    return h(valor);

}


// ================================================================
// CEP
// ================================================================

function formatarCep(valor) {

    if (!valor) {
        return "";
    }

    const numero =
        String(valor)
            .replace(
                /\D/g,
                ""
            );

    if (
        numero.length === 8
    ) {

        return (
            numero.substring(
                0,
                5
            ) +
            "-" +
            numero.substring(5)
        );

    }

    return h(valor);

}


// ================================================================
// CHAVE NF-e
// ================================================================

function formatarChave(chave) {

    if (!chave) {
        return "";
    }

    const limpa =
        String(chave)
            .replace(
                /\s/g,
                ""
            );

    const grupos =
        limpa.match(
            /.{1,4}/g
        );

    if (!grupos) {
        return limpa;
    }

    return grupos.join(" ");

}


// ================================================================
// CAMPO
// ================================================================

function campo(
    titulo,
    valor,
    largura
) {

    return `
        <div
            class="cell"
            style="width:${largura}"
        >

            <span class="label">
                ${h(titulo)}
            </span>

            <span class="valor">
                ${valor || ""}
            </span>

        </div>
    `;

}


// ================================================================
// CAMPO DINHEIRO
// ================================================================

function dinheiro(
    titulo,
    valor,
    largura
) {

    let texto = "";

    if (
        valor !== null &&
        valor !== undefined &&
        valor !== ""
    ) {

        texto =
            "R$ " +
            moeda(valor);

    }

    return campo(
        titulo,
        texto,
        largura
    );

}


// ================================================================
// CÓDIGO DE BARRAS CODE 128C
// ================================================================

function gerarCodigoBarras(chave) {

    if (!chave) {
        return "";
    }

    chave =
        String(chave)
            .replace(
                /\D/g,
                ""
            );

    if (
        chave.length === 0 ||
        chave.length % 2 !== 0
    ) {
        return "";
    }

    const patterns = [

        "212222","222122","222221","121223","121322",
        "131222","122213","122312","132212","221213",
        "221312","231212","112232","122132","122231",
        "113222","123122","123221","223211","221132",
        "221231","213212","223112","312131","311222",
        "321122","321221","312212","322112","322211",
        "212123","212321","232121","111323","131123",
        "131321","112313","132113","132311","211313",
        "231113","231311","112133","112331","132131",
        "113123","113321","133121","313121","211331",
        "231131","213113","213311","213131","311123",
        "311321","331121","312113","312311","332111",
        "314111","221411","431111","111224","111422",
        "121124","121421","141122","141221","112214",
        "112412","122114","122411","142112","142211",
        "241211","221114","413111","241112","134111",
        "111242","121142","121241","114212","124112",
        "124211","411212","421112","421211","212141",
        "214121","412121","111143","111341","131141",
        "114113","114311","411113","411311","113141",
        "114131","311141","411131",
        "211412","211214","211232","2331112"

    ];


    const codigos = [105];

    let checksum = 105;
    let posicao = 1;


    for (
        let i = 0;
        i < chave.length;
        i += 2
    ) {

        const valor =
            parseInt(
                chave.substring(
                    i,
                    i + 2
                ),
                10
            );

        codigos.push(
            valor
        );

        checksum +=
            valor *
            posicao;

        posicao++;

    }


    checksum =
        checksum % 103;


    codigos.push(
        checksum
    );

    codigos.push(
        106
    );


    let modulo = 0;


    codigos.forEach(
        codigo =>
        {

            const pattern =
                patterns[codigo];

            for (
                const c of pattern
            ) {

                modulo +=
                    Number(c);

            }

        }
    );


    const margem = 10;

    const largura =
        modulo +
        margem * 2;


    let svg = `

        <svg

            class="barcode"

            viewBox="
                0 0 ${largura} 50
            "

            preserveAspectRatio="none"

            xmlns="
                http://www.w3.org/2000/svg
            "

        >

    `;


    let x = margem;


    codigos.forEach(
        codigo =>
        {

            const pattern =
                patterns[codigo];

            let barra = true;


            for (
                const c of pattern
            ) {

                const w =
                    Number(c);


                if (barra) {

                    svg += `

                        <rect

                            x="${x}"

                            y="0"

                            width="${w}"

                            height="45"

                            fill="black"

                        />

                    `;

                }


                x += w;

                barra =
                    !barra;

            }

        }
    );


    svg +=
        "</svg>";


    return svg;

}


// ================================================================
// MONTA A DANFE
// ================================================================

function montarDanfe(d) {


    const ide =

    const emit =
        d.emit || {};


    const dest =
        d.dest || {};

        d.total || {};

        d.volume || {};

        d.adicionais || {};

        d.produtos || [];


    // ============================================================
    // PRODUTOS
    // ============================================================

    let produtosHtml = "";


    produtos.forEach(
        prod =>
        {

            produtosHtml += `

                <tr>

                    <td>
                        ${h(prod.codigo)}
                    </td>

                    <td>
                        ${h(prod.descricao)}
                    </td>

                    <td class="center">
                        ${h(prod.ncm)}
                    </td>

                    <td class="center">
                        ${h(prod.cst)}
                    </td>

                    <td class="center">
                        ${h(prod.cfop)}
                    </td>

                    <td class="center">
                        ${h(prod.unidade)}
                    </td>

                    <td class="right">
                        ${h(prod.quantidade)}
                    </td>

                    <td class="right">
                        ${moeda(prod.valorUnitario)}
                    </td>

                    <td class="right">
                        ${moeda(prod.valorTotal)}
                    </td>

                    <td class="right">
                        ${moeda(prod.baseICMS)}
                    </td>

                    <td class="right">
                        ${moeda(prod.valorICMS)}
                    </td>

                    <td class="right">
                        ${moeda(prod.valorIPI)}
                    </td>

                    <td class="right">
                        ${h(prod.aliquotaICMS)}
                    </td>

                </tr>

            `;

        }
    );


    // ============================================================
    // ENDEREÇO EMITENTE
    // ============================================================

    const enderecoEmitente =
        [
            emit.logradouro,
            emit.numero
        ]
        .filter(Boolean)
        .join(", ");


    const cidadeEmitente =
        [
            emit.municipio,
            emit.uf
        ]
        .filter(Boolean)
        .join(" / ");


    // ============================================================
    // ENDEREÇO DESTINATÁRIO
    // ============================================================

    let enderecoDestinatario =
        [
            dest.logradouro,
            dest.numero
        ]
        .filter(Boolean)
        .join(", ");


    if (
        dest.complemento
    ) {

        enderecoDestinatario +=
            " - " +
            dest.complemento;

    }


    // ============================================================
    // HTML

    <div class="danfe">


        <!-- ====================================================
             CABEÇALHO
        ===================================================== -->

        <div class="box row">


            <div class="emitente">


                <div class="emitenteNome">

                    ${h(emit.nome)}

                </div>


                ${h(enderecoEmitente)}

                <br>


                ${h(emit.bairro)}

                <br>


                ${h(cidadeEmitente)}

                <br>


                CEP ${formatarCep(emit.cep)}


            </div>


            <div class="danfeCentro">


                <div class="danfeTitulo">

                    DANFE

                </div>


                <div class="danfeDescricao">

                    DOCUMENTO AUXILIAR DA

                    <br>

                    NOTA FISCAL ELETRÔNICA

                </div>


                <br>


                0 - ENTRADA

                <br>


                1 - SAÍDA &nbsp;


                <b>

                    ${h(ide.tipoNF)}

                </b>


                <div class="numero">

                    Nº ${h(ide.numero)}

                </div>


                SÉRIE ${h(ide.serie)}


            </div>


            <div class="chaveArea">


                ${gerarCodigoBarras(d.chave)}


                <span class="label">

                    CHAVE DE ACESSO

                </span>


                <div class="chave">

                    ${h(
                        formatarChave(
                            d.chave
                        )
                    )}

                </div>


            </div>


        </div>


        <!-- ====================================================
             NATUREZA
        ===================================================== -->


        <div class="box row">


            ${campo(
                "Natureza da Operação",
                h(ide.natureza),
                "100%"
            )}


        </div>


        <div class="box row">


            ${campo(
                "Inscrição Estadual",
                h(emit.ie),
                "33%"
            )}


            ${campo(
                "Inscrição Estadual Subst. Tributário",
                h(emit.iest),
                "33%"
            )}


            ${campo(
                "CNPJ",
                formatarDocumento(
                    emit.cnpj
                ),
                "34%"
            )}


        </div>


        <!-- ====================================================
             DESTINATÁRIO
        ===================================================== -->


        <div class="section">

        </div>

            ${campo(
                "Nome / Razão Social",
                h(dest.nome),
                "55%"
            )}


            ${campo(
                "CNPJ / CPF",

                    dest.documento
                ),
                "25%"
            )}


            ${campo(
                "Data da Emissão",
                dataFormatada(
                    ide.dataEmissao

            )}

                "Endereço",

                "50%"

            ${campo(
                "Bairro / Distrito",
                h(dest.bairro),

            )}


            ${campo(
                "CEP",
                formatarCep(

                "25%"
            )}


        </div>


        <div class="box row">


            ${campo(

                h(dest.municipio),
                "35%"
            )}


            ${campo(
                "Fone",
                h(dest.fone),
                "20%"
            )}


            ${campo(

                h(dest.uf),
                "10%"
            )}


            ${campo(

                "35%"
            )}


        </div>


        <!-- ====================================================
             IMPOSTOS
        ===================================================== -->


        <div class="section">

            CÁLCULO DO IMPOSTO

        </div>


        <div class="box row">

            )}


            ${campo(

            )}


            ${campo(

                h(transp.uf),
                "15%"
            )}


        </div>


        <div class="box row">


            ${campo(
                "Endereço",
                h(transp.endereco),
                "40%"
            )}


            ${campo(
                "Município",
                h(transp.municipio),
                "30%"
            )}


            ${campo(

                "
            >


                <span class="label">

                    Reservado ao Fisco

                </span>


                ${h(
                    adicionais.fisco
                )}


            </div>


        </div>


        <!-- ====================================================
             AVISO
        ===================================================== -->


        <div class="aviso">


            <b>

                ESPELHO DA NF-e PARA IMPRESSÃO

            </b>


            <br>


            Documento auxiliar gerado a partir
            dos dados disponíveis no XML.


        </div>


        <!-- ====================================================
             BOTÃO
        ===================================================== -->


        <div class="naoImprimir">


            <button
                onclick="window.print()"
            >

                IMPRIMIR / SALVAR COMO PDF

            </button>


        </div>


    </div>

    `;

}


// ================================================================
// INICIALIZAÇÃO
// ================================================================

async function iniciar() {

    try {


        // --------------------------------------------------------
        // PEGA O PAYLOAD DA URL
        // --------------------------------------------------------

        const payload =
            window.location.hash
                .substring(1);


        if (!payload) {

            throw new Error(
                "Nenhum dado foi informado."
            );

        }


        // --------------------------------------------------------
        // DESCOMPACTA GZIP
        // --------------------------------------------------------

        const json =
            await descompactarPayload(
                payload
            );


        // --------------------------------------------------------
        // CONVERTE JSON
        // --------------------------------------------------------

        const dados =
            JSON.parse(json);


        // --------------------------------------------------------
        // MONTA DANFE
        // --------------------------------------------------------

        document
            .getElementById(
                "conteudo"
            )
            .innerHTML =
            montarDanfe(dados);


        // --------------------------------------------------------
        // TÍTULO DA ABA
        // --------------------------------------------------------

        if (
            dados.numero
        ) {

            document.title =
                "DANFE " +
                dados.numero;

        }


    }
    catch (erro) {


        console.error(
            "Erro DANFE:",
            erro
        );


        document
            .getElementById(
                "conteudo"
            )
            .innerHTML = `


            <div class="erro">


                <h2>

                    Não foi possível abrir a DANFE

                </h2>


                <p>

                    Os dados do documento são inválidos
                    ou não puderam ser descompactados.

                </p>


                <p>

                    Gere novamente o link da DANFE
                    pelo chatbot.

                </p>


            </div>


        `;

    }

}


// ================================================================
// EXECUTA
// ================================================================

iniciar();


</script>
